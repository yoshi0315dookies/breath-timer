<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10283a"><title>深呼吸タイマー</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#eaf5fb;background:#0c1e2b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(155deg,#0b2030,#173d4b);padding:24px 14px 60px}.app{max-width:540px;margin:auto}h1{font-size:25px;margin:0 0 6px}.sub{color:#a8c6d0;margin:0 0 22px}.panel{background:#ffffff10;border:1px solid #ffffff22;border-radius:22px;padding:18px;margin:14px 0}.timer{text-align:center;padding:28px 16px}.phase{font-size:27px;font-weight:700;margin:14px 0}.circle{height:195px;width:195px;margin:20px auto;border-radius:50%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:radial-gradient(circle at 35% 30%,#6de0d7,#277e9a);box-shadow:0 0 0 14px #70d9d01a,0 0 40px #58d4d040;transition:transform .35s ease}.circle.inhale{transform:scale(1.08)}.circle.exhale{transform:scale(.85)}.seconds{font-size:68px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1}.small{font-size:13px;color:#d6f2f3}.progress{height:9px;border-radius:9px;background:#ffffff30;overflow:hidden;margin:20px 0 8px}.fill{height:100%;width:0;background:#72d9cc;transition:width .15s}.stats{display:flex;justify-content:space-between;color:#c1dbe4;font-variant-numeric:tabular-nums;font-size:14px}.actions{display:flex;gap:10px;margin-top:22px}button{border:0;border-radius:13px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer;background:#e1f3f6;color:#143746}button.primary{background:#62d6c7;color:#092d36;flex:2}button.secondary{flex:1}button.danger{background:#ffffff18;color:#fff}button:disabled{opacity:.4;cursor:not-allowed}.heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}h2{font-size:18px;margin:0}label{font-size:13px;color:#c3dbe2;display:block;margin-bottom:6px}input,select{width:100%;background:#102d3c;border:1px solid #577381;color:white;border-radius:10px;padding:11px;font-size:16px;min-width:0}input[type=number]{font-variant-numeric:tabular-nums}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.step{display:grid;grid-template-columns:minmax(0,1fr) 85px 40px;gap:8px;margin:9px 0;align-items:end}.step button{padding:11px 4px;background:#ffffff18;color:white}.hint{font-size:13px;color:#b5d2db;line-height:1.6}.summary{margin-top:12px;color:#8fe5d9;font-size:14px}.add{width:100%;background:#ffffff16;color:#dff9f6;border:1px dashed #6facae;margin-top:8px}.soundrow{display:flex;align-items:center;justify-content:space-between;gap:12px}.soundrow label{margin:0;font-size:15px}.soundrow input{width:22px;height:22px;accent-color:#62d6c7}.foot{text-align:center;color:#9bb9c4;font-size:12px;margin-top:16px}@media(prefers-reduced-motion:reduce){.circle,.fill{transition:none}}</style></head><body><main class="app"><h1>🌿 深呼吸タイマー</h1><p class="sub">自分のリズムで、ゆっくり呼吸。</p><section class="panel timer"><div id="phase" class="phase" aria-live="polite">準備完了</div><div id="circle" class="circle"><div id="seconds" class="seconds">4</div><div class="small">秒</div></div><div class="progress"><div id="fill" class="fill"></div></div><div class="stats"><span>経過 <b id="elapsed">00:00</b></span><span>残り <b id="remaining">05:00</b></span></div><div class="stats" style="margin-top:9px"><span>サイクル <b id="cycle">0</b> 回完了</span><span id="status">待機中</span></div><div class="actions"><button id="start" class="primary">開始</button><button id="reset" class="secondary danger">リセット</button></div></section><section class="panel"><div class="soundrow"><label for="sound">🔔 ステップ切り替え音（ピッ）</label><input id="sound" type="checkbox" checked></div><p class="hint">開始時・すべてのステップの境目（吸う→止めるなど）・終了時に音が鳴ります。iPhoneではマナーモードや音量設定によって聞こえない場合があります。</p></section><section class="panel"><h2 style="margin-bottom:14px">合計時間</h2><div class="fields"><div><label for="minutes">分</label><input id="minutes" type="number" min="0" max="999" value="5" inputmode="numeric"></div><div><label for="totalSeconds">秒</label><input id="totalSeconds" type="number" min="0" max="59" value="0" inputmode="numeric"></div></div><p class="hint">設定した合計時間で終了します。最後の動作は途中で終了する場合があります。</p></section><section class="panel"><div class="heading"><h2>呼吸ステップ</h2><button id="preset" class="danger" style="font-size:12px">初期設定</button></div><div id="steps"></div><button id="add" class="add">＋ ステップを追加</button><div id="summary" class="summary"></div><p class="hint">好きな動作を自由に組み合わせられます。設定はこのブラウザに自動保存されます。</p></section><p class="foot">無理に息を止めず、苦しくなったら中断してください。</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),defaults=[{name:'吸う',sec:4},{name:'止める',sec:2},{name:'吐く',sec:6},{name:'止める',sec:2}];let steps=defaults.map(x=>({...x})),target=300,elapsed=0,anchor=0,atStart=0,active=false,raf=0,audio=null,lastStep=-1,finishedSound=false;const names=['吸う','吐く','止める','休む','自由入力'];const fmt=n=>{n=Math.max(0,Math.ceil(n));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')};function load(){try{let v=JSON.parse(localStorage.getItem('breathSettings'));if(v&&Array.isArray(v.steps)&&v.steps.length){steps=v.steps.filter(x=>typeof x.name==='string'&&Number.isFinite(+x.sec)&&+x.sec>0).slice(0,30).map(x=>({name:x.name.slice(0,30),sec:Math.min(3600,Math.round(+x.sec))}));if(!steps.length)steps=defaults.map(x=>({...x}));$('minutes').value=v.minutes??5;$('totalSeconds').value=v.seconds??0;$('sound').checked=v.sound!==false}}catch(e){}}function save(){localStorage.setItem('breathSettings',JSON.stringify({steps,minutes:$('minutes').value,seconds:$('totalSeconds').value,sound:$('sound').checked}))}function unlockAudio(){if(!$('sound').checked)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{})}catch(e){}}function beep(frequency=880,length=.13){if(!$('sound').checked)return;try{unlockAudio();if(!audio)return;const osc=audio.createOscillator(),gain=audio.createGain(),now=audio.currentTime;osc.type='sine';osc.frequency.value=frequency;gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.16,now+.012);gain.gain.exponentialRampToValueAtTime(.0001,now+length);osc.connect(gain);gain.connect(audio.destination);osc.start(now);osc.stop(now+length+.015)}catch(e){}}function stepIndex(t){return locate(t).i}function soundTransitions(from,to){if(!$('sound').checked||to<=from)return;const d=duration();let offsets=[],sum=0;for(let i=0;i<steps.length;i++){sum+=steps[i].sec;offsets.push(sum)}let first=Math.floor(from/d),last=Math.floor(to/d);for(let cycle=first;cycle<=last;cycle++){for(let j=0;j<offsets.length;j++){let boundary=cycle*d+offsets[j];if(boundary>from+0.0001&&boundary<=to+0.0001&&boundary<target-0.0001)beep()}}}function duration(){return steps.reduce((a,s)=>a+s.sec,0)}function readTarget(){let m=Number($('minutes').value),s=Number($('totalSeconds').value);if(!Number.isFinite(m)||!Number.isFinite(s)||m<0||s<0||m>999||s>59||!Number.isInteger(m)||!Number.isInteger(s))return null;return m*60+s}function renderSteps(){let wrap=$('steps');wrap.replaceChildren();steps.forEach((step,i)=>{let row=document.createElement('div');row.className='step';let sel=document.createElement('select');sel.setAttribute('aria-label','ステップ'+(i+1)+'の動作');let custom=!names.slice(0,-1).includes(step.name);names.forEach(n=>{let o=document.createElement('option');o.value=n;o.textContent=n;sel.append(o)});sel.value=custom?'自由入力':step.name;let sec=document.createElement('input');sec.type='number';sec.min=1;sec.max=3600;sec.inputMode='numeric';sec.value=step.sec;sec.setAttribute('aria-label','ステップ'+(i+1)+'の秒数');let del=document.createElement('button');del.textContent='×';del.title='削除';del.setAttribute('aria-label','ステップ'+(i+1)+'を削除');del.disabled=steps.length===1;sel.addEventListener('change',()=>{if(sel.value==='自由入力'){let n=prompt('動作の名前を入力してください','休憩');if(n&&n.trim())step.name=n.trim().slice(0,30);else step.name='休む'}else step.name=sel.value;save();renderSteps();update()});sec.addEventListener('change',()=>{step.sec=Math.min(3600,Math.max(1,Math.round(Number(sec.value)||1)));save();renderSteps();update()});del.addEventListener('click',()=>{if(steps.length>1){steps.splice(i,1);save();renderSteps();update()}});row.append(sel,sec,del);wrap.append(row)});$('summary').textContent='1サイクル：'+duration()+'秒（'+steps.length+'ステップ）';document.querySelectorAll('#steps button,#steps input,#steps select,#add,#preset,#minutes,#totalSeconds').forEach(el=>el.disabled=active)}function locate(t){let d=duration(),offset=t%d;for(let i=0;i<steps.length;i++){if(offset<steps[i].sec)return {i,remaining:steps[i].sec-offset};offset-=steps[i].sec}return {i:0,remaining:steps[0].sec}}function update(){let t=readTarget();if(t!==null&&!active&&elapsed===0)target=t;let done=target>0&&elapsed>=target;let loc=locate(Math.min(elapsed,Math.max(0,target-0.001)));$('phase').textContent=done?'おつかれさま！':elapsed===0&&!active?'準備完了':steps[loc.i].name;$('seconds').textContent=done?'0':Math.max(1,Math.ceil(Math.min(loc.remaining,target-elapsed)));$('elapsed').textContent=fmt(elapsed);$('remaining').textContent=fmt(target-elapsed);$('cycle').textContent=Math.floor(elapsed/duration());$('fill').style.width=(target?Math.min(100,elapsed/target*100):0)+'%';$('circle').className='circle '+(done?'':steps[loc.i].name==='吸う'?'inhale':steps[loc.i].name==='吐く'?'exhale':'');$('status').textContent=done?'完了':active?'実行中':elapsed>0?'一時停止中':'待機中';$('start').textContent=active?'一時停止':done?'もう一度':'開始';}function stop(){active=false;cancelAnimationFrame(raf);$('start').textContent='再開';renderSteps();update()}function tick(){if(!active)return;let previous=elapsed;elapsed=Math.min(target,atStart+(performance.now()-anchor)/1000);soundTransitions(previous,elapsed);if(elapsed>=target){if(!finishedSound){beep(660,.25);finishedSound=true}stop();update();return}update();raf=requestAnimationFrame(tick)}$('start').onclick=()=>{if(active){stop();return}let t=readTarget();if(t===null||t<1){alert('合計時間を1秒以上で正しく設定してください。');return}unlockAudio();if(elapsed>=target){elapsed=0;finishedSound=false}if(elapsed===0){target=t;finishedSound=false;beep()}active=true;anchor=performance.now();atStart=elapsed;renderSteps();tick()};$('reset').onclick=()=>{stop();elapsed=0;finishedSound=false;target=readTarget()||300;update()};$('add').onclick=()=>{if(steps.length>=30){alert('ステップは30個までです');return}steps.push({name:'吸う',sec:4});save();renderSteps();update()};$('preset').onclick=()=>{steps=defaults.map(x=>({...x}));save();renderSteps();update()};['minutes','totalSeconds'].forEach(id=>$(id).addEventListener('change',()=>{save();update()}));document.addEventListener('visibilitychange',()=>{if(!document.hidden&&active)tick()});$('sound').addEventListener('change',()=>{save();if($('sound').checked){unlockAudio();beep()}});load();renderSteps();update()})();
</script></body></html>
